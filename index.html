<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Escolha a sua massa preferida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { padding:2vh 3vw; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  .quadro { height:100%; display:flex; flex-direction:column; padding:2vh 2.5vw 1.2vh; }
  h1 { text-align:center; line-height:1.08; text-transform:uppercase; font-size:5vh; font-size:clamp(24px,5.2vh,70px); }
  .sub { display:flex; align-items:center; margin:1.4vh 0 1.8vh; text-transform:uppercase; font-size:2.1vh; font-size:clamp(13px,2.1vh,28px); }
  .sub span { padding:0 2vw; }
  .sub::before,.sub::after { content:""; flex:1; }
  .grid { flex:1; display:flex; flex-wrap:wrap; justify-content:space-between; align-content:space-between; min-height:0; }
  .item { position:relative; width:32%; height:31.5%; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1vh; min-height:0; }
  @supports (display:grid) {
    .grid { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:1.4vh 1.6vw; }
    .item { width:auto; height:auto; }
  }
  .foto { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .foto img { max-width:96%; max-height:100%; object-fit:contain; mix-blend-mode:multiply; }
  .vazio { display:none; width:50%; height:75%; border-radius:50%; background:#ecebe8; border:2px dashed #b9b6b0; align-items:center; justify-content:center; font-weight:700; color:#8a8680; font-size:5vh; }
  .item.sem-foto img { display:none; } .item.sem-foto .vazio { display:flex; }
  .nome { text-align:center; padding:.6vh .5vw 0; line-height:1.15; max-width:100%; overflow-wrap:break-word; font-size:2.5vh; font-size:clamp(14px,2.5vh,34px); }
  .item.off .foto, .item.off .nome { -webkit-filter:grayscale(1); filter:grayscale(1); opacity:.35; }
  .item.off::after { content:"Indisponível"; position:absolute; left:-20%; right:-20%; top:40%; -webkit-transform:rotate(-12deg); transform:rotate(-12deg);
    text-align:center; color:#fff; padding:.9vh 0; text-transform:uppercase; letter-spacing:.16em; font-size:2.3vh; font-size:clamp(13px,2.3vh,30px); }
  .logo { height:9vh; height:clamp(52px,10vh,130px); align-self:center; margin-top:1.2vh; mix-blend-mode:multiply; }
  #estado { position:fixed; right:8px; bottom:3px; font:11px Arial,sans-serif; color:#9a968f; }

  /* ---- Visual do restaurante (preto e branco) ---- */
  body.tema-restaurante { background:#f7f7f5; color:#151515; font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif; }
  .tema-restaurante .quadro { border:3px solid #151515; }
  .tema-restaurante h1 { font-weight:700; letter-spacing:.02em; }
  .tema-restaurante .sub { font-weight:500; letter-spacing:.14em; }
  .tema-restaurante .sub::before,.tema-restaurante .sub::after { border-top:2px solid #151515; }
  .tema-restaurante .item { border:2px solid #151515; background:#fff; }
  .tema-restaurante .nome { font-weight:500; text-transform:uppercase; }
  .tema-restaurante .item.off { background:#e4e3e0; }
  .tema-restaurante .item.off::after { background:#151515; font-family:Oswald,"Arial Narrow",Arial,sans-serif; font-weight:700; }

  /* ---- Sem caixas: cada massa fica solta, sem contorno ---- */
  body.sem-caixas .item { border:0; background:transparent; }
  body.sem-caixas .item.off { background:transparent; }
</style>
</head>
<body>
<div class="quadro">
  <h1>Escolha a sua <br>massa preferida</h1>
  <div class="sub"><span>Massas à escolha</span></div>
  <main class="grid" id="grid"></main>
  <img class="logo" src="img/logo.png" alt="Giorno Pasta & Pizza">
</div>
<div id="estado"></div>

<script>
/* ================= CONFIGURAÇÃO ================= */

// Caixas pretas à volta de cada massa: true = com caixas, false = sem caixas.
// Para comparar sem editar: abrir a página com  ?caixas=sim  ou  ?caixas=nao
var CAIXAS = false;

// Ligação CSV da folha de cálculo publicada (Ficheiro > Partilhar > Publicar na Web > CSV).
// Sem ligação, a página NÃO lê o ficheiro planilha-massas.csv do computador.
var SHEET_URL = "https://docs.google.com/spreadsheets/d/1cWNIOZcYu9YA9mqWr_eKesJS-6WD6EjK3Dunko_bflY/edit?usp=sharing";

// De quanto em quanto tempo verifica a folha (minutos)
var MINUTOS = 3;

// As fotos ficam na pasta img/ com o número da massa (1.png, 2.png ...).
// A página procura por esta ordem: .png, .jpg, .svg (os desenhos incluídos).
var MASSAS = [
  { n:1, nome:"Fusilli Tricolor",    disponivel:true },
  { n:2, nome:"Fusilli",             disponivel:false },
  { n:3, nome:"Fusilli Integral",    disponivel:true },
  { n:4, nome:"Spaghetti",           disponivel:true },
  { n:5, nome:"Tagliatelle",         disponivel:true },
  { n:6, nome:"Tortiglioni",         disponivel:true },
  { n:7, nome:"Penne Rigate",        disponivel:true },
  { n:8, nome:"Tagliatelle Spinaci", disponivel:true },
  { n:9, nome:"Farfalle",            disponivel:true }
];

/* ================================================= */

function param(nome) {
  var m = new RegExp("[?&]" + nome + "=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
if (param("caixas")) CAIXAS = !/^(nao|não|n|0|false)$/i.test(param("caixas"));
if (param("csv")) SHEET_URL = param("csv");
document.body.className = "tema-restaurante" + (CAIXAS ? "" : " sem-caixas");

var CHAVE = "massas-estado-v4", elementos = {}, estado = {}, EXT = ["png", "jpg", "svg"];
function guardar() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} }
var salvo = null;
try { salvo = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) {}

function carregarFoto(img, el, n, i) {
  if (i >= EXT.length) { el.className += " sem-foto"; return; }
  img.onerror = function () { carregarFoto(img, el, n, i + 1); };
  img.src = "img/" + n + "." + EXT[i];
}

var grid = document.getElementById("grid");
MASSAS.forEach(function (m) {
  estado[m.n] = salvo && salvo.hasOwnProperty(m.n) ? salvo[m.n] : m.disponivel;
  var el = document.createElement("div");
  el.className = "item";
  el.innerHTML = '<div class="foto"><img alt=""><div class="vazio">' + m.n + '</div></div><div class="nome">' + m.n + ' - ' + m.nome + '</div>';
  carregarFoto(el.getElementsByTagName("img")[0], el, m.n, 0);
  grid.appendChild(el);
  elementos[m.n] = el;
});

function desenhar() {
  MASSAS.forEach(function (m) {
    var el = elementos[m.n], off = !estado[m.n], tem = / off/.test(el.className);
    if (off && !tem) el.className += " off";
    if (!off && tem) el.className = el.className.replace(" off", "");
  });
}

// CSV: n , nome , disponivel   (nao / não / n / false / 0 / no / x = indisponível; maiúsculas e acentos não importam)
function lerCSV(texto) {
  var linhas = texto.replace(/^\uFEFF/, "").split(/\r?\n/), novo = {}, achou = 0;
  for (var k = 0; k < linhas.length; k++) {
    var c = linhas[k].split(/[,;]/), n = parseInt(c[0].replace(/["\s]/g, ""), 10);
    if (!n || c.length < 2) continue;
    var v = (c[c.length - 1] || "").replace(/["\s]/g, "").toLowerCase();
    novo[n] = !/^(nao|não|n|false|0|no|x)$/.test(v);
    achou++;
  }
  return achou ? novo : null;
}

var infoEl = document.getElementById("estado");
function hora() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

function atualizar() {
  if (!SHEET_URL) return;
  var xhr = new XMLHttpRequest();
  xhr.open("GET", SHEET_URL + (SHEET_URL.indexOf("?") > -1 ? "&" : "?") + "t=" + new Date().getTime(), true);
  xhr.timeout = 15000;
  xhr.onload = function () {
    var novo = (xhr.status === 200 || xhr.status === 0) ? lerCSV(xhr.responseText) : null;
    if (novo) {
      MASSAS.forEach(function (m) { if (novo.hasOwnProperty(m.n)) estado[m.n] = novo[m.n]; });
      guardar(); desenhar(); infoEl.textContent = "atualizado às " + hora();
    } else infoEl.textContent = "sem atualização (a mostrar o último estado)";
  };
  xhr.onerror = xhr.ontimeout = function () { infoEl.textContent = "sem ligação à internet (a mostrar o último estado)"; };
  xhr.send();
}

// Só para testar: ?off=4,6 marca essas massas como indisponíveis (sem folha de cálculo)
if (param("off")) {
  var lista = param("off").split(",");
  MASSAS.forEach(function (m) { estado[m.n] = lista.indexOf(String(m.n)) === -1; });
}
desenhar(); atualizar();
setInterval(atualizar, MINUTOS * 60 * 1000);
</script>
</body>
</html>
